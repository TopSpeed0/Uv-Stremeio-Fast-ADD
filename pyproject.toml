[project]
name = "stremio-fast-add"
version = "1.0.0"
description = "Clone a whole Stremio addon setup into another account in one uv command, with a GUI that shows what installed and what failed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TopSpeed0" }]
keywords = ["stremio", "addons", "uv", "gui", "tkinter"]
dependencies = []

[project.urls]
Homepage = "https://github.com/TopSpeed0/Uv-Stremeio-Fast-ADD"

[project.scripts]
stremio-fast-add = "stremio_fast_add.cli:main"
stremio-add = "stremio_fast_add.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stremio_fast_add"]
